{% extends "base.html" %} {% block title %} {{super()}} - Add Membership {%
endblock %} {% block content %}
<h2>Assign Member to Band (Membership)</h2>
<form method="post" id="albumshipForm">
  <label>Band:</label>
  <select name="bandid">
    <option value="">-- select band --</option>
    {% for band in bands %}
    <option value="{{ band.BandID }}">{{ band.BandName }}</option>
    {% endfor %}
  </select><br />
  <label>Album:</label>
  <select name="albumid">
    <option value="">-- select album --</option>
    {% for album in albums %}
    <option value="{{ album.AlbumID }}">{{ album.AlbumTitle }}</option>
    {% endfor %}
  </select><br />
  <button type="submit">Save Albumship</button>
</form>
{% endblock %}
